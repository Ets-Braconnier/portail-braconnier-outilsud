<!DOCTYPE html>
<html lang="fr">
<head>
<script id="portal-access-guard">
(function(){
  const TOKEN_KEY="braconnier_portal_token_v3";
  const AUTH_API="https://braconnier-auth.sebastien-025.workers.dev";
  document.documentElement.style.visibility="hidden";
  const token=sessionStorage.getItem(TOKEN_KEY);
  if(!token){ location.replace(new URL("/base/index.html",location.origin).href); return; }
  fetch(AUTH_API+"/auth/check",{headers:{Authorization:"Bearer "+token},cache:"no-store"})
    .then(r=>{if(!r.ok)throw new Error("unauthorized"); document.documentElement.style.visibility="";})
    .catch(()=>{sessionStorage.removeItem(TOKEN_KEY);location.replace(new URL("/base/index.html",location.origin).href);});
})();
</script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../favicon.png">
  <title>Calculateur de foisonnement – Bast Aménagement</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    :root {
      --anthracite: #111827;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --green: #1f5f34;
      --green-dark: #174b29;
      --green-soft: #eef6f0;
      --soft-bg: #f9fafb;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: #e5e7eb;
      color: var(--text);
    }

    .foison-wrapper {
      max-width: 1000px;
      margin: 2.3rem auto;
      padding: 1.7rem 1.8rem 1.9rem;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 22px;
      border: 1px solid rgba(0, 0, 0, 0.04);
      box-shadow:
        0 18px 45px rgba(15, 23, 42, 0.10),
        0 0 0 1px rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(18px);
    }

    .foison-title {
      text-align: center;
      font-size: 1.35rem;
      margin-bottom: 1.65rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-weight: 500;
      color: var(--anthracite);
    }

    .foison-layout {
      display: grid;
      grid-template-columns: minmax(280px, 0.88fr) minmax(360px, 1.12fr);
      gap: 1.35rem;
      align-items: start;
    }

    .foison-panel {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(229, 231, 235, 0.95);
      border-radius: 20px;
      padding: 1.25rem;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.055);
    }

    .panel-title {
      margin: 0 0 1.1rem;
      color: #555555;
      font-size: 0.88rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.13em;
    }

    .foison-inputs {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .foison-field {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .foison-label {
      font-size: 0.88rem;
      font-weight: 500;
      color: #374151;
    }

    .foison-label span {
      font-weight: 400;
      color: #9ca3af;
      font-size: 0.84rem;
    }

    .foison-input, .foison-select {
      padding: 0.62rem 0.9rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      font-size: 0.95rem;
      outline: none;
      background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.96), rgba(243, 244, 246, 0.96));
      box-shadow:
        inset 0 0 0 0 rgba(255, 255, 255, 0),
        0 1px 3px rgba(148, 163, 184, 0.35);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, transform 0.08s ease;
      width: 100%;
      color: var(--text);
    }

    .foison-input::placeholder { color: #c4cbd5; }

    .foison-input:focus, .foison-select:focus {
      border-color: #111827;
      background: #ffffff;
      box-shadow:
        inset 0 0 0 1px rgba(17, 24, 39, 0.06),
        0 0 0 6px rgba(17, 24, 39, 0.07);
      transform: translateY(-0.5px);
    }

    .foison-actions {
      display: flex;
      gap: 0.7rem;
      margin-top: 1.15rem;
    }

    .foison-btn {
      border: none;
      border-radius: 999px;
      padding: 0.7rem 1.05rem;
      font-size: 0.92rem;
      font-weight: 650;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
      flex: 1;
    }

    .foison-btn:hover { transform: translateY(-1px); }

    .foison-btn.primary {
      background: var(--anthracite);
      color: #ffffff;
      box-shadow: 0 8px 18px rgba(17, 24, 39, 0.18);
    }

    .foison-btn.secondary {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid rgba(229, 231, 235, 0.9);
    }

    .foison-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 245px;
      text-align: center;
      color: #6b7280;
      background: #f9fafb;
      border: 1px dashed rgba(148, 163, 184, 0.75);
      border-radius: 18px;
      padding: 1.4rem 1rem;
      font-size: 0.94rem;
      line-height: 1.55;
    }

    .foison-results {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.85rem;
    }

    .foison-result {
      background: #f9fafb;
      border: 1px solid rgba(229, 231, 235, 0.9);
      border-radius: 18px;
      padding: 0.95rem 1rem;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.045);
      min-height: 92px;
    }

    .foison-result.main {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, rgba(238, 246, 240, 0.98), rgba(255, 255, 255, 0.98));
      border-color: rgba(31, 95, 52, 0.18);
    }

    .foison-result-label {
      display: block;
      margin-bottom: 0.35rem;
      color: #6b7280;
      font-size: 0.83rem;
      font-weight: 500;
    }

    .foison-result-value {
      display: block;
      font-size: 1.28rem;
      line-height: 1.2;
      font-weight: 700;
      color: var(--anthracite);
    }

    .foison-result.main .foison-result-value {
      font-size: 1.55rem;
      color: var(--green-dark);
    }

    .foison-result-note {
      display: block;
      margin-top: 0.35rem;
      color: #6b7280;
      font-size: 0.78rem;
      line-height: 1.35;
    }


    @media (max-width: 820px) {
      .foison-wrapper {
        margin: 1.7rem 0.9rem 2rem;
        padding: 1.35rem 1.1rem 1.65rem;
        border-radius: 20px;
      }

      .foison-title {
        font-size: 1.1rem;
        letter-spacing: 0.12em;
      }

      .foison-layout {
        grid-template-columns: 1fr;
      }

      .foison-actions {
        flex-direction: column-reverse;
      }

      .foison-btn { width: 100%; }
    }

    @media (max-width: 520px) {
      .foison-results {
        grid-template-columns: 1fr;
      }

      .foison-result.main {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>
  <div class="foison-wrapper">
    <div class="foison-title">CALCULATEUR DE FOISONNEMENT</div>

    <div class="foison-layout">
      <section class="foison-panel">
        <h2 class="panel-title">Données</h2>

        <div class="foison-inputs">
          <div class="foison-field">
            <label class="foison-label" for="volume">Volume en place <span>(m³)</span></label>
            <input id="volume" class="foison-input" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Entrez le volume en m³">
          </div>

          <div class="foison-field">
            <label class="foison-label" for="soil">Type de sol</label>
            <select id="soil" class="foison-select"></select>
          </div>

          <div class="foison-field">
            <label class="foison-label" for="humidity">Humidité</label>
            <select id="humidity" class="foison-select">
              <option value="sec" selected>Sec</option>
              <option value="normal">Normal</option>
              <option value="humide">Humide</option>
              <option value="tresHumide">Très humide</option>
            </select>
          </div>

          <div class="foison-field">
            <label class="foison-label" for="vehicle">Véhicule / benne</label>
            <select id="vehicle" class="foison-select"></select>
          </div>

          <div class="foison-field" id="customField" style="display:none;">
            <label class="foison-label" for="customCoef">Coefficient personnalisé</label>
            <input id="customCoef" class="foison-input" type="number" min="1" step="0.01" value="1.25" inputmode="decimal">
          </div>
        </div>

        <div class="foison-actions">
          <button class="foison-btn secondary" type="button" id="resetBtn">Réinitialiser</button>
          <button class="foison-btn primary" type="button" id="calcBtn">Calculer</button>
        </div>
      </section>

      <section class="foison-panel">
        <h2 class="panel-title">Résultats</h2>

        <div id="placeholder" class="foison-placeholder">
          Entrez un volume pour afficher l’estimation.
        </div>

        <div id="results" class="foison-results" style="display:none;">
          <div class="foison-result main">
            <span class="foison-result-label">Volume à évacuer</span>
            <span class="foison-result-value" id="resFoisonne">–</span>
            <span class="foison-result-note" id="resMainNote">–</span>
          </div>

          <div class="foison-result">
            <span class="foison-result-label">Poids estimé</span>
            <span class="foison-result-value" id="resWeight">–</span>
          </div>

          <div class="foison-result">
            <span class="foison-result-label">Voyages estimés</span>
            <span class="foison-result-value" id="resTrips">–</span>
          </div>

          <div class="foison-result">
            <span class="foison-result-label">Volume en place</span>
            <span class="foison-result-value" id="resVolume">–</span>
          </div>

          <div class="foison-result">
            <span class="foison-result-label">Surplus</span>
            <span class="foison-result-value" id="resSurplus">–</span>
          </div>

          <div class="foison-result">
            <span class="foison-result-label">Coefficient</span>
            <span class="foison-result-value" id="resCoef">–</span>
          </div>

          <div class="foison-result">
            <span class="foison-result-label">Densité utilisée</span>
            <span class="foison-result-value" id="resDensity">–</span>
          </div>

        </div>
      </section>
    </div>
  </div>

  <script>
    const soils = {
      terreVegetale: { name: "Terre végétale", coef: 1.15, densities: { sec: 1.20, normal: 1.35, humide: 1.50, tresHumide: 1.65 } },
      terreLimoneuse: { name: "Terre limoneuse", coef: 1.20, densities: { sec: 1.30, normal: 1.45, humide: 1.60, tresHumide: 1.75 } },
      terreArgileuse: { name: "Terre argileuse", coef: 1.28, densities: { sec: 1.40, normal: 1.60, humide: 1.80, tresHumide: 2.00 } },
      terreSablonneuse: { name: "Terre sablonneuse", coef: 1.15, densities: { sec: 1.35, normal: 1.50, humide: 1.65, tresHumide: 1.80 } },
      sable: { name: "Sable", coef: 1.12, densities: { sec: 1.45, normal: 1.60, humide: 1.75, tresHumide: 1.90 } },
      pierreux: { name: "Terrain pierreux / cailloux", coef: 1.18, densities: { sec: 1.60, normal: 1.80, humide: 2.00, tresHumide: 2.20 } },
      roche: { name: "Roche", coef: 1.50, densities: { sec: 1.60, normal: 1.80, humide: 2.00, tresHumide: 2.20 } },
      personnalise: { name: "Personnalisé", coef: 1.25, densities: { sec: 1.30, normal: 1.50, humide: 1.70, tresHumide: 1.90 } }
    };

    const vehicles = {
      remorque750: { name: "Petite remorque 750 kg", payload: 0.50 },
      camionnette: { name: "Camionnette", payload: 1.00 },
      utilitaire35: { name: "Camion / utilitaire 3,5 T", payload: 1.20 },
      benne35: { name: "Benne 3,5 T", payload: 1.50 },
      camion10: { name: "Camion 10 T", payload: 6.00 },
      camion19: { name: "Camion 19 T", payload: 10.00 },
      camion26: { name: "Camion 26 T", payload: 15.00 },
      semi: { name: "Semi-remorque", payload: 25.00 }
    };

    function formatNumber(value, decimals = 2) {
      return Number(value).toLocaleString("fr-BE", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });
    }

    function populateSelects() {
      const soilSelect = document.getElementById("soil");
      Object.entries(soils).forEach(([key, soil]) => {
        const option = document.createElement("option");
        option.value = key;
        option.textContent = soil.name;
        soilSelect.appendChild(option);
      });
      soilSelect.value = "terreVegetale";

      const vehicleSelect = document.getElementById("vehicle");
      Object.entries(vehicles).forEach(([key, vehicle]) => {
        const option = document.createElement("option");
        option.value = key;
        option.textContent = vehicle.name;
        vehicleSelect.appendChild(option);
      });
      vehicleSelect.value = "remorque750";
    }

    function getSelectedCoef(soilKey) {
      if (soilKey === "personnalise") {
        const custom = parseFloat(String(document.getElementById("customCoef").value).replace(",", "."));
        return isNaN(custom) || custom < 1 ? 1 : custom;
      }
      return soils[soilKey].coef;
    }

    function hasValidVolume() {
      const raw = String(document.getElementById("volume").value).trim();
      const value = parseFloat(raw.replace(",", "."));
      return raw !== "" && !isNaN(value) && value > 0;
    }

    function calculate() {
      const placeholder = document.getElementById("placeholder");
      const results = document.getElementById("results");

      if (!hasValidVolume()) {
        placeholder.style.display = "flex";
        results.style.display = "none";
        return;
      }

      const volume = parseFloat(String(document.getElementById("volume").value).replace(",", "."));
      const soilKey = document.getElementById("soil").value;
      const humidityKey = document.getElementById("humidity").value;
      const vehicleKey = document.getElementById("vehicle").value;
      const soil = soils[soilKey];
      const vehicle = vehicles[vehicleKey];
      const coef = getSelectedCoef(soilKey);
      const density = soil.densities[humidityKey];

      const foisonne = volume * coef;
      const surplus = foisonne - volume;
      const surplusPercent = volume > 0 ? (surplus / volume) * 100 : 0;
      const weight = foisonne * density;
      const trips = vehicle.payload > 0 ? Math.ceil(weight / vehicle.payload) : 0;

      document.getElementById("resVolume").textContent = `${formatNumber(volume)} m³`;
      document.getElementById("resCoef").textContent = formatNumber(coef, 2);
      document.getElementById("resFoisonne").textContent = `${formatNumber(foisonne)} m³`;
      document.getElementById("resMainNote").textContent = `${formatNumber(volume)} m³ en place deviennent environ ${formatNumber(foisonne)} m³ après excavation.`;
      document.getElementById("resSurplus").textContent = `${formatNumber(surplus)} m³ (+${formatNumber(surplusPercent, 0)} %)`;
      document.getElementById("resWeight").textContent = `${formatNumber(weight)} T`;
      document.getElementById("resTrips").textContent = trips <= 1 ? `${trips} voyage` : `${trips} voyages`;
      document.getElementById("resDensity").textContent = `${formatNumber(density)} T/m³`;

      placeholder.style.display = "none";
      results.style.display = "grid";
    }

    function toggleCustomField() {
      const isCustom = document.getElementById("soil").value === "personnalise";
      document.getElementById("customField").style.display = isCustom ? "flex" : "none";
    }

    function resetForm() {
      document.getElementById("volume").value = "";
      document.getElementById("soil").value = "terreVegetale";
      document.getElementById("humidity").value = "sec";
      document.getElementById("vehicle").value = "remorque750";
      document.getElementById("customCoef").value = "1.25";
      toggleCustomField();
      calculate();
    }

    document.addEventListener("DOMContentLoaded", () => {
      populateSelects();
      document.getElementById("soil").addEventListener("change", () => { toggleCustomField(); calculate(); });
      document.getElementById("humidity").addEventListener("change", calculate);
      document.getElementById("vehicle").addEventListener("change", calculate);
      document.getElementById("volume").addEventListener("input", calculate);
      document.getElementById("customCoef").addEventListener("input", calculate);
      document.getElementById("calcBtn").addEventListener("click", calculate);
      document.getElementById("resetBtn").addEventListener("click", resetForm);
      resetForm();
    });
  </script>
</body>
</html>
